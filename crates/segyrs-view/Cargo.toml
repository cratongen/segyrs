[package]
name = "segyrs-view"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version = "1.95"
description = "Native segyrs section viewer: eframe on wgpu, softbuffer fallback"
publish = false

[features]
default = ["window"]
# The window stack. Off, the crate builds the viewer state only and `run`
# returns `ViewError::Disabled`, so a reader-only build stays light.
window = ["dep:eframe", "dep:winit", "dep:softbuffer", "dep:pollster", "dep:bytemuck"]

[dependencies]
segyrs = { path = "../segyrs" }
segyrs-draw = { path = "../segyrs-draw" }
thiserror = "2.0"
# eframe and its wgpu move together: wgpu is used only through eframe's re-export.
eframe = { version = "0.37", optional = true, default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
winit = { version = "0.30", optional = true, default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", optional = true }
pollster = { version = "1.0", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
pollster = "1.0"
