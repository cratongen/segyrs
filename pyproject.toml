[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "segyrs"
description = "Reading, writing and manipulation of huge SEG-Y files: a Rust core with Python bindings"
readme = "README.md"
# The floor is pyo3's abi3-py311 (crates/segyrs-py/Cargo.toml) and the oldest
# Python pinned in mise.toml; the newest classifier is the newest pinned (S-44).
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD-PARTY-LICENSES.txt"]
keywords = ["seg-y", "segy", "seismic", "geophysics", "zarr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=2"]
dynamic = ["version"]

[project.urls]
Homepage = "https://cratongen.github.io/segyrs/"
Documentation = "https://cratongen.github.io/segyrs/"
Repository = "https://github.com/cratongen/segyrs"
Issues = "https://github.com/cratongen/segyrs/issues"
Changelog = "https://github.com/cratongen/segyrs/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "segyio>=1.9.15; python_version < '3.14'"]

[tool.maturin]
manifest-path = "crates/segyrs-py/Cargo.toml"
python-source = "python"
module-name = "segyrs._segyrs"
# One abi3 wheel per platform. Rust is linked statically into the extension,
# so a wheel carries no sidecar shared library (S-43).
strip = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
